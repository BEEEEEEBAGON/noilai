# Fixed few-shot demonstrations: three base pairs, from which noilai.eval.prompts.build_demos
# derives three demonstrations for every task x variant cell with the rule engine
# (noilai.gen.variants). The pairs were chosen so that every variant yields a legal,
# non-identity output and so that none of their syllables (inputs or outputs) occurs in
# the pilot item file or the attested seed (data/attested_seed.tsv, inputs and outputs);
# the run refuses an item file that shares a syllable with them unless --allow-demo-overlap
# is given (the release generator should reserve these syllables).
#
# [NATIVE-CHECK] the three inputs are ordinary words; the outputs are rule outputs and
# need not be words. Glosses are for the validator, not for the prompt.
version: 1
pairs:
  - syllables: [trung, bình]
    gloss: "average"
  - syllables: [làm, chủ]
    gloss: "to own; to be master of"
  - syllables: [vô, hình]
    gloss: "invisible"
# T3 demonstrations alternate yes / no / yes over the three pairs; the "no" demonstration
# uses the output of another variant on the same input (an other_variant twin).
t3_pattern: ["yes", "no", "yes"]
# T2 withholds the variant, so its demonstrations are the same for every item: pair i is
# shown as the nói lái produced by t2_variants[i]. V4 is therefore never demonstrated in T2.
t2_variants: [V1, V2, V3]
