[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noilai"
version = "0.1.0"
description = "NóiLái: can subword LLMs reach the onset, rime and tone inside Vietnamese syllables?"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
eval = ["transformers>=4.45", "torch>=2.2", "sentencepiece>=0.2", "tokenizers>=0.20", "protobuf>=4", "accelerate>=0.30", "openai>=1.40", "google-genai>=1.0", "groq>=0.11"]
vllm = ["vllm==0.30.0"]                       # DESIGN_DECISIONS 7.3: one vLLM version for the whole campaign (the notebooks' VLLM_VERSION; tests/test_cloud.py keeps the three equal)
llama_cpp = ["llama-cpp-python==0.3.35"]      # DESIGN_DECISIONS 7.3: the GGUF fallback engine (PhoGPT, T4 fallbacks)
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "nbformat>=5.10", "matplotlib>=3.8", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["noilai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
