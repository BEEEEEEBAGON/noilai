# --------------------------------------------------------------------------- compute table
# The plan's line items (section 3), re-budgeted within the plan's 70-150 GPU-hour subtotal:
# `noilai_main` grows from 10-20 to 16-32 (DD 12.11's 4,200-item sample + the explicit-input main
# result), a new `ablations` line of 4-8 holds the four prompt ablations, `counterfactuals` grows
# from 10-25 to 17-41 (the DD 8.3 family runs five arms on the 2,800 T1/T3 main-sample items, not
# four arms on the core), and the 100% buffer shrinks from 35-75 to 18-39 to pay for all three.
# `runs[*].counts_toward` maps runs onto these lines; the test asserts that the GPU lines sum to
# 70-150 and that every line's runs fit it.
plan_lines:
  pilots_and_smoke:      {where: "Kaggle T4",        unit: gpu_hours, low: 5,  high: 5,  cash_usd: 0}
  noilai_main:           {where: "Kaggle T4, 2xT4",  unit: gpu_hours, low: 16, high: 32, cash_usd: 0, note: "plan: 10-20 for 3,000 items; 4,200 items + explicit-input main result"}
  ablations:             {where: "Kaggle T4, 2xT4",  unit: gpu_hours, low: 4,  high: 8,  cash_usd: 0, note: "zero-shot, name-only, English instruction, spaced input on the core (plan 2.5-2.6)"}
  reasoning:             {where: "Kaggle T4",        unit: gpu_hours, low: 5,  high: 10, cash_usd: 0}
  counterfactuals:       {where: "Kaggle T4",        unit: gpu_hours, low: 17, high: 41, cash_usd: 0, note: "plan: 10-25 for C1-C3 on the core; DD 8.3's family on the main sample (T1, T3) + C2-enriched + XCOPA"}
  probing:               {where: "Kaggle 2xT4",      unit: gpu_hours, low: 5,  high: 15, cash_usd: 0}
  reruns_and_debugging:  {where: "Kaggle",           unit: gpu_hours, low: 18, high: 39, cash_usd: 0, note: "the plan's 100% buffer (35-75) minus the re-budgeted lines above; also books the two 1-GPU-h DD 6.1/6.2 agreement checks (E3_scope_item, E3_engine_hf)"}
  tpu_models_and_bf16:   {where: "Kaggle TPU",       unit: tpu_hours, low: 10, high: 20, cash_usd: 0}
  bf16_reruns_fallback:  {where: "Modal L4",         unit: l4_hours,  low: 5,  high: 15, cash_usd: 0, note: "card on file; ~37 free L4-h/month"}
  api_runs:              {where: "Gemini, Groq free tiers", unit: api_calls, low: 12300, high: 12300, tokens: 6900000, cash_usd: 0, note: "plan: ~12,000 calls (4 models x up to ~3,000); the matrix above sums to 12,300 calls and 6.9M tokens exactly (each API line is a fixed count; tests/test_cloud.py checks both sums). Gemini's unpaid tier trains on inputs, so its models are refused on every core-derived line until the author decides (DD 11.2 / 13.18)"}
  optional_fifth_api:    {where: "OpenRouter free models", unit: api_calls, low: 3000, high: 3000, cash_usd: 10}
gpu_subtotal: {low: 70, high: 150, note: "2.5-5 weeks of Kaggle's ~30 free GPU-hours a week"}
quota:
  kaggle_gpu_hours_per_week: 30      # https://aimultiple.com/free-cloud-gpu ; secondary, dated source (plan 3)
  kaggle_tpu_hours_per_week: 20      # one TPU v5e-8 session at a time, 9 h max
  kaggle_session_hours_gpu: 12
  kaggle_session_hours_tpu: 9
  kaggle_work_hours_per_session: 9   # DD 7.6: <= 9 h of work per 12-h session; outputs persist only if the version completes
  kaggle_working_dir_gb: 20          # models and outputs belong in Kaggle/HF datasets
  window: "Oct 5, 2026 - Jan 4, 2027: ~390 GPU-h and ~260 TPU-h available"
