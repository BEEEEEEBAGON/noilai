# configs/run_plan.yaml -- the run matrix of docs/PLAN_2026-09-30.md (sections 2.5-2.6 and 3),
# amended by docs/DESIGN_DECISIONS.md (4.5 sub-samples, 7.4 ablations, 12.11 sample size,
# 12.17 explicit input as a main result, 12.32 `--limit` smoke-only).
#
# One entry under `runs` per line of the compute table. `scripts/kaggle_run_plan.py --run <id>`
# turns an entry into one `scripts/run_eval.py` command per model:
#
#   run_eval.py --model-config <name> --items <path> --tasks ... --variants ... --paraphrases ...
#               --shots N --arms ... [--input-format F] [--instruction I] [--language L]
#               [--smoke --limit N (smoke runs only)] [--in-core-only] --resume --run-id <id>__<name> --out-root data/runs
#
# (`run_eval_out_style` chooses between the CLI's `--run-id/--out-root` pair, as landed, and the
# `--out <dir>` flag of the first specification; the run directory is data/runs/<id>__<name> either way.)
#
# Item files. `release` names the release version ONCE; every `{release}` in a path is replaced
# by it when the plan is loaded (kaggle_run_plan.load_plan / kaggle_verify_items). No run line
# samples at run time (DESIGN_DECISIONS 4.5 / 12.32): every sub-sample is a seeded FILE, either
# written by the data owner's `scripts/sample_items.py` (noilai_main, noilai_c2; recorded under
# `samples` in the release manifest) or derived deterministically from another item file by
# `scripts/kaggle_run_plan.py --materialize` from the `derive` block below (seed + per-cell counts;
# T3 drawn as yes/no pairs; the core kept whole; vulgar rows excluded). `--limit` is emitted for
# `experiment: smoke` lines only and refused anywhere else. `sha256` is null until the data freeze
# (Gate 2, 8 Nov 2026); once recorded, scripts/kaggle_verify_items.py refuses a file whose hash
# differs. Observed hashes of the working-tree build are kept as comments for traceability only.
#
# Estimates are the plan's (author's estimate, no source unless given) re-budgeted within the
# plan's 70-150 GPU-hour subtotal: the DD 12.11 raise of the main sample (3,000 -> 4,200), the
# ablation lines the plan requires (2.5-2.6) and the DD 8.3 E3 family on the main sample are
# carved out of the 100% rerun buffer; every GPU line is re-priced from the pilot's measured
# tokens/s (DD 8.5, item 30). tests/test_cloud.py checks that the lines still sum to 70-150 and
# that no run exceeds the line it counts toward. Model names must exist in configs/models.yaml;
# `model_sets` expand to lists of names.
#
# Arms (DD 6.1 / 6.3 / 12.5): the release is stored in the OLD placement style, so the C2 arm is
# `placement_new` everywhere (`placement_old` changes no prompt on the release and the runner
# refuses such an arm); the E3 family is the DD 8.3 enumeration {nfd, pc, strip_tones, strip_all}
# x {T1, T3, XCOPA} on the main sample plus {placement_new} x {T1, T3} on the C2-enriched file;
# tests/test_cloud.py checks every arm against noilai.constants.ARMS and against the release copy.
# Schedule (DD 8.8): no line whose item file carries `canary_required: true` (a test-split file)
# is scheduled before 8 November 2026 (stage-2 pre-registration); E3 runs on dev only before that.

version: 2
date: 2026-09-30
plan: docs/PLAN_2026-09-30.md
design: docs/DESIGN_DECISIONS.md
run_eval_cli: scripts/run_eval.py
run_eval_out_style: run_id_root      # run_id_root -> "--run-id <id>__<name> --out-root <runs_root>"; out -> "--out <runs_root>/<id>__<name>"
runs_root: data/runs
compute_log: data/compute_log.csv    # [UNCERTAIN: verify] location pending the author's confirmation (README, open question)
release: data/release/v0.2           # DESIGN_DECISIONS 12.30: v0.1 and v0.2 are superseded; v0.3 is rebuilt at the generator-freeze commit (stage 1) -- bump this key then and re-record the item_files hashes
release_manifest: "{release}/manifest.json"

api:
  assumed_tokens_per_call: 500       # plan 3: "roughly 500 tokens a call"; used for rows whose usage the provider did not return
  park_threshold: 0.95               # a failed API command with >= 95% of a daily cap used is "parked", not "failed"

item_files:
  noilai_test:
    path: "{release}/noilai_test.jsonl"
    sha256: null           # recorded at the data freeze; verified by scripts/kaggle_verify_items.py
    description: "gated test split (CC BY-NC-ND 4.0), header record + canary on every row; the source of noilai_main and noilai_core; no run line reads it whole"
    canary_required: true
  noilai_main:
    path: "{release}/noilai_main.jsonl"
    sha256: null
    description: "open-model main sample: 4,200 test items = 350 per T1/T2/T3 x variant cell (DD 12.11; T3 as 175 yes/no pairs), contains the core; written by scripts/sample_items.py main"
    canary_required: true
    produced_by: "scripts/sample_items.py main --release {release} --per-cell 350 --seed 20261201"
    manifest_sample: main          # `samples.main.sha256` in the release manifest must equal the observed hash
    expected_counts: {per_cell: 350, n_items: 4200}
  noilai_core:
    path: "{release}/noilai_core.jsonl"
    sha256: null
    description: "balanced core: 125 per T1/T2 cell, 62 yes/no pairs per T3 cell (1,496 items in v0.2; DD 4.5 allows 1,496-1,500); the only NóiLái test items an API may see, and only a provider with no-training terms (DD 11.2: Groq; never Gemini's unpaid tier); the source of the derived core subsets"
    canary_required: true
  noilai_dev:
    path: "{release}/noilai_dev.jsonl"
    sha256: null
    description: "public dev split (CC BY 4.0); prompt development, smoke tests and the pilot"
    canary_required: false
  noilai_c2:
    path: "{release}/noilai_c2.jsonl"
    sha256: null
    description: "C2-enriched T1 set for H4 (DD 4.5 / 12.6): a separate seeded build from an independent pseudo pool, every item C2-affected, excluded from E1/E2; written by scripts/sample_items.py c2 (the verify gate refuses the file while it holds no items)"
    canary_required: true
    produced_by: "scripts/sample_items.py c2 --release {release} --n 500 --seed 20261202"
    manifest_sample: c2
  attested:
    path: "{release}/attested.jsonl"
    sha256: null
    description: "200-400 attested folk/literary examples (34 rows in v0.2, V1-V6 labels); items with vulgar=yes never reach an API or the human form"
    canary_required: false
  xcopa_vi_test:
    path: data/external/xcopa_test_vi.jsonl
    sha256: 24cb28827066abb00a2f4004d86c447c4a30a9edb17938b26b61fb2385f94170   # data/HASHES.json
    description: "XCOPA Vietnamese test, 500 items, CC BY 4.0; the E3 re-encoding arms"
    canary_required: false
    kind: xcopa
  # ---- derived, seeded sub-samples (DD 4.5): written by `kaggle_run_plan.py --materialize`, never drawn at run time
  noilai_api_para300:
    path: "{release}/noilai_api_para300.jsonl"
    sha256: null
    description: "DD 4.5 paraphrase subset for API models: 296 core items (25 per T1/T2 cell, 12 yes/no pairs per T3 cell) under p1 and p2; also the E3 API set"
    canary_required: true
    derive: {source: noilai_core, seed: 20261006, per_cell: {T1: 25, T2: 25, T3: 24}, in_core_only: true}
    expected_counts: {n_items: 296}
  noilai_reasoning500:
    path: "{release}/noilai_reasoning500.jsonl"
    sha256: null
    description: "the 500-item thinking-ON sub-study set: core items so that the API variants see nothing new (43/42/40 per T1/T2/T3 cell)"
    canary_required: true
    derive: {source: noilai_core, seed: 20261007, per_cell: {T1: 43, T2: 42, T3: 40}, in_core_only: true}
    expected_counts: {n_items: 500}
  noilai_bf16_200:
    path: "{release}/noilai_bf16_200.jsonl"
    sha256: null
    description: "the ~200-item bf16 drift set: core items so the same rows exist in every T4 run (17/17/16 per T1/T2/T3 cell)"
    canary_required: true
    derive: {source: noilai_core, seed: 20261008, per_cell: {T1: 17, T2: 17, T3: 16}, in_core_only: true}
    expected_counts: {n_items: 200}
  noilai_scope500:
    path: "{release}/noilai_scope500.jsonl"
    sha256: null
    description: "DD 6.1 / 6.2 agreement-check set: 500 core items (63 per T1 cell, 31 yes/no pairs per T3 cell; the two E3 Holm tasks) on which Gemma 3 1B runs the secondary arm scope `item` and the C1 arm through a second engine (HF); a subset of noilai_main, so the vLLM whole_prompt reference comes from E3_noilai on the same rows"
    canary_required: true
    derive: {source: noilai_core, seed: 20261011, tasks: [T1, T3], per_cell: {T1: 63, T3: 62}, in_core_only: true}
    expected_counts: {n_items: 500}
  pilot_t1_200:
    path: "{release}/pilot_t1_200.jsonl"
    sha256: null
    description: "Gate 1 pilot (DD 8.5): 200 dev items, 50 per T1 variant; its go/no-go criterion lives in docs/PREREGISTRATION.md section 10"
    canary_required: false
    derive: {source: noilai_dev, seed: 20261009, tasks: [T1], per_cell: {T1: 50}}
    expected_counts: {n_items: 200}
  pilot_xcopa_200:
    path: data/external/pilot_xcopa_200.jsonl
    sha256: null
    description: "Gate 1 pilot (DD 8.5): 200 XCOPA-vi test items, seeded"
    canary_required: false
    kind: xcopa
    derive: {source: xcopa_vi_test, seed: 20261010, n: 200}
    expected_counts: {n_items: 200}
  sealed:
    path: data/release/sealed/noilai_test.jsonl
    sha256: null
    description: "regenerated at release with another seed and canary; NEVER sent to any API"
    canary_required: true
    never_to_api: true

model_sets:
  pilot: [gemma-3-1b-it, qwen3.5-2b, phogpt-4b-chat]
  t4_single:
    - gemma-3-1b-it
    - qwen3.5-0.8b
    - qwen3.5-2b
    - qwen3.5-4b
    - qwen3.5-9b
    - gemma-4-e2b
    - gemma-4-e4b
    - gemma-sea-lion-v4.5-e2b-it
    - sailor2-8b-chat
    - phogpt-4b-chat
    - vistral-7b-chat
    - llama-3.1-8b-instruct
  t4_double: [gemma-3-4b-it, gemma-4-12b]
  t4_all: {union: [t4_single, t4_double]}
  tpu: [gemma-3-12b-it, qwen3.8-27b, qwen-sea-lion-v4.5-27b-it]
  api: [gemini-flash, gemini-flash-lite, gpt-oss-120b, gpt-oss-20b]
  self_hosted: {union: [t4_single, t4_double, tpu]}
  panel: {union: [t4_single, t4_double, tpu, api]}
  bf16_reference: {group: bf16_reference}          # every entry of that group in models.yaml
  reasoning_t4: [qwen3.5-4b--thinking, qwen3.5-9b--thinking]
  reasoning_tpu: [qwen3.8-27b--thinking]
  reasoning_api: [gpt-oss-120b--thinking, gpt-oss-20b--thinking, gemini-flash--thinking]
  # E3 subset: the fastest fp16/fp32 T4 models plus the TPU trio, chosen so that the arms fit
  # 10-25 GPU-h; the full panel runs C1-C3 only if the pilot's throughput allows (plan 3).
  e3_open: {union: [t4_single, t4_double, tpu]}

# --------------------------------------------------------------------------- experiments
experiments:
  pilot: "week-2 go/no-go: three open models on 200 items per idea (plan 2.6, Gate 1 on 18 Oct 2026; criterion in docs/PREREGISTRATION.md section 10)"
  smoke: "every model family loads, generates and returns log-probs (open models) on 20 items before the panel is fixed; the only lines allowed a --limit"
  E1: "all 21 models on NóiLái against human, random and copy baselines (plan 2.6); explicit onset-rime-tone input is a main result (DD 12.17)"
  E1_ablation: "prompt ablations of plan 2.5-2.6 / DD 7.4 on the core: zero-shot, name-only, English instruction, character-spaced input"
  E3: "orthographic counterfactual arms on NóiLái and Vietnamese XCOPA (plan 2.6): the DD 8.3 family {nfd, pc, strip_tones, strip_all} x {T1, T3, XCOPA} on the main sample, C2 (placement_new) on the enriched set for H4 (DD 12.6); test-split lines after 8 Nov (DD 8.8); the DD 6.1/6.2 scope and engine agreement checks on a 500-item Gemma 3 1B subset"
  reasoning: "500-item run with thinking ON: accuracy vs reasoning tokens (plan 2.5; appendix, DD 12.36)"
  bf16_drift: "~200 items per T4 model re-run unquantized in bf16 (plan 2.5; appendix, DD 12.36)"
  E4: "tone probing and activation patching on Gemma 3 1B/4B in fp32 (plan 2.6; noilai.probe, not run_eval)"

runs:

  - id: pilot_t1_200
    experiment: pilot
    purpose: "Gate 1 evidence on T1: 50 dev items per variant, nfc vs nfd (DD 8.5: two pilot lines, one criterion in PREREGISTRATION section 10)"
    platform: kaggle
    hardware: t4
    models: {set: pilot}
    items: pilot_t1_200          # seeded dev-derived file; the test split stays untouched until the panel is fixed
    tasks: [T1]
    variants: [V1, V2, V3, V4]
    arms: [nfc, nfd]
    paraphrases: [p0]
    shots: 3
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 2}
    counts_toward: pilots_and_smoke
    week: "Oct 12-18"

  - id: pilot_xcopa_200
    experiment: pilot
    purpose: "Gate 1 evidence on XCOPA: 200 seeded XCOPA-vi items, nfc vs nfd, scored by log-likelihood"
    platform: kaggle
    hardware: t4
    models: {set: pilot}
    items: pilot_xcopa_200
    tasks: [XCOPA]
    variants: []
    arms: [nfc, nfd]
    paraphrases: [p0]
    shots: 0
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 1}
    counts_toward: pilots_and_smoke
    week: "Oct 12-18"

  - id: smoke_20
    experiment: smoke
    purpose: "load + generate + log-prob check per T4 model family before the panel is fixed (the TPU trio: smoke_20_tpu)"
    platform: kaggle
    hardware: mixed             # each model on its own configured hardware (t4 or 2xt4)
    models: {set: t4_all}
    items: noilai_dev
    tasks: [T1, T3]
    variants: [V1]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    limit: 20                   # smoke-only (DD 12.32); refused on any other experiment
    in_core_only: false
    estimate: {unit: gpu_hours, low: 2, high: 2}   # the plan books pilots + smoke at ~5 GPU-h in all; see `plan_lines`
    counts_toward: pilots_and_smoke
    week: "Oct 19-25"

  - id: smoke_20_tpu
    experiment: smoke
    purpose: "the TPU trio must load under vLLM-TPU and return prompt log-probabilities before a full run (plan 3)"
    platform: kaggle
    hardware: tpu
    models: {set: tpu}
    items: noilai_dev
    tasks: [T1, T3]
    variants: [V1]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    limit: 20
    in_core_only: false
    estimate: {unit: tpu_hours, low: 1, high: 1}   # three vLLM-TPU startups of 6-22 minutes each
    counts_toward: tpu_models_and_bf16
    week: "Oct 19-25"

  - id: E1_main
    experiment: E1
    purpose: "NóiLái main runs: the 4,200-item stratified test sample (350 per cell, contains the core; DD 12.11) under three paraphrases, reasoning off, <= 64 output tokens"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: noilai_main
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0, p1, p2]
    shots: 3
    in_core_only: false
    estimate: {unit: gpu_hours, low: 13, high: 26}   # the plan's 9-18 for 3,000 items scaled by 4,200/3,000; re-priced from the pilot (DD 8.5)
    counts_toward: noilai_main
    week: "Nov 9-15"
    note: "the TPU trio's part of this line is booked under tpu_main; the T4 notebook skips them (session hardware guard) and the TPU notebook runs them"

  - id: E1_explicit_input
    experiment: E1
    main_result: true
    purpose: "MAIN RESULT (DD 12.17): the same prompt with the input given as explicit onset-rime-tone components; the only condition that separates rule knowledge from sub-token access. Core items, main paraphrase; paired with E1_main on the same rows"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: noilai_core
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    input_format: components
    in_core_only: false
    estimate: {unit: gpu_hours, low: 2, high: 4}
    counts_toward: noilai_main
    week: "Nov 9-15"

  - id: E1_attested
    experiment: E1
    purpose: "the attested folk/literary examples (task 'attested', rendered as T1): H6 memorization signature; open models only (vulgar rows never reach an API)"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: attested
    tasks: [attested]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0, p1, p2]
    shots: 3
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 2}
    counts_toward: noilai_main
    week: "Nov 9-15"
    note: "attested rows are selected by run_eval's --attested-policy (default exact2: exact two-syllable rows, the H6-eligible set; DD 4.7 / 12.16), not by --variants, which filters the T1/T2/T3 cells only. prompts/noilai.yaml carries templates for V1-V4, so a V5/V6-labelled exact row (DD 12.1) can be rendered only once the eval owner adds those templates (open question). Items sharing a syllable with a demonstration are flagged per row (--demo-overlap-policy flag, the default); an item EQUAL to a demonstration phrase is refused unless EXTRA_ARGS carries --allow-demo-overlap"

  - id: E1_abl_zero_shot
    experiment: E1_ablation
    purpose: "ablation (plan 2.5, DD 7.4): the explained instruction with no demonstrations, core items, main paraphrase"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: noilai_core
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0]
    shots: 0
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 2}
    counts_toward: ablations
    week: "Nov 16-22"

  - id: E1_abl_name_only
    experiment: E1_ablation
    purpose: "ablation: the variant's name without the step-by-step description (cultural recall vs rule-following; plan 2.3)"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: noilai_core
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    instruction: name_only
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 2}
    counts_toward: ablations
    week: "Nov 16-22"

  - id: E1_abl_english
    experiment: E1_ablation
    purpose: "ablation: English instruction, Vietnamese items and answer line"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: noilai_core
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    language: en
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 2}
    counts_toward: ablations
    week: "Nov 16-22"

  - id: E1_abl_spaced
    experiment: E1_ablation
    purpose: "ablation: character-spaced input (the encoding x spacing 2x2 of DD 8.6 on the nfc side)"
    platform: kaggle
    hardware: mixed
    models: {set: self_hosted}
    items: noilai_core
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    input_format: spaced
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 2}
    counts_toward: ablations
    week: "Nov 16-22"

  - id: E1_api_core
    experiment: E1
    purpose: "API models on the core (1,496 items), main paraphrase"
    platform: api
    hardware: api
    models: {set: api}
    items: noilai_core
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p0]
    shots: 3
    in_core_only: true
    estimate: {unit: api_calls, low: 6000, high: 6000, tokens: 3000000}
    counts_toward: api_runs
    week: "Nov 9-22 (Groq: ~4 days per model at 200K tokens/day; the ledger parks a model at its cap)"

  - id: E1_api_paraphrase
    experiment: E1
    purpose: "API models on the 296-item core subset under the two other paraphrases (prompt-sensitivity range; DD 4.5 paraphrase subset)"
    platform: api
    hardware: api
    models: {set: api}
    items: noilai_api_para300
    tasks: [T1, T2, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc]
    paraphrases: [p1, p2]
    shots: 3
    in_core_only: true
    estimate: {unit: api_calls, low: 2400, high: 2400, tokens: 1200000}
    counts_toward: api_runs
    week: "Nov 16-22"

  - id: E3_noilai
    experiment: E3
    purpose: "the DD 8.3 Table 3 family on NóiLái: C1 (nfd), C1' (pc), C3a (strip_tones), C3b (strip_all) against the nfc baseline on the main sample, T1 and T3 (the Holm cells; T2 is not one); the three-arm base < pc < nfd contrast (DD 6.4 / 8.6) and the H3 crossover on V3 come from the same rows"
    platform: kaggle
    hardware: mixed
    models: {set: e3_open}
    items: noilai_main
    tasks: [T1, T3]
    variants: [V1, V2, V3, V4]
    arms: [nfc, nfd, pc, strip_tones, strip_all]
    paraphrases: [p0]
    shots: 3
    in_core_only: false
    estimate: {unit: gpu_hours, low: 12, high: 28}   # 2,800 main-sample items x 5 arms (the core x 4 arms was 5-12); re-priced from the pilot (DD 8.5)
    counts_toward: counterfactuals
    week: "Nov 9-22"
    note: "DD 8.8: a test-split E3 line runs only after the stage-2 pre-registration (8 Nov); the nfc column duplicates E1_main's p0 nfc rows on these items so that every arm of the family is scored under one run manifest. C2 is not run on the main sample (DD 6.3 / 12.6: E3_c2_enriched)"

  - id: E3_c2_enriched
    experiment: E3
    purpose: "H4 (DD 12.6): C2 on the C2-enriched T1 set, every item affected by the placement flip; excluded from E1/E2 by construction"
    platform: kaggle
    hardware: mixed
    models: {set: e3_open}
    items: noilai_c2
    tasks: [T1]
    variants: [V1, V2, V3, V4]
    arms: [nfc, placement_new]
    paraphrases: [p0]
    shots: 3
    in_core_only: false
    estimate: {unit: gpu_hours, low: 1, high: 3}
    counts_toward: counterfactuals
    week: "Nov 9-22"
