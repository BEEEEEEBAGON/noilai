    gated: true
    family: gemma3
    group: interpretability_ladder
    params_b: 1.0
    tokenizer_type: "SentencePiece BPE, 262,144 pieces, identity normalizer, byte fallback (data/audit/gemma3.json)"
    backend: vllm
    fallback_backend: hf
    dtype: float32
    never_float16: true
    quantization: null
    hardware: t4
    max_model_len: 1024
    chat_template_kwargs: {}
    verify: []
    notes:
      - "Gemma 3 overflows in fp16; even the clamping fix cut one benchmark average from 0.752 to 0.657 (https://github.com/huggingface/transformers/pull/36832). fp32 on the T4."
      - "Gemma Scope 2 residual SAEs exist for every layer (https://huggingface.co/google/gemma-scope-2-4b-it and siblings); E4 uses this model and the 4B."
      - "Shares the tokenizer audited in data/audit/gemma3.json: 1.78 tokens per syllable (NFC), 2.83 (NFD); does not normalize NFD (3.4% same ids)."

