# configs/models.yaml -- the model panel of docs/PLAN_2026-09-30.md, sections 2.5 and 3.
#
# One entry per (model, serving configuration). `scripts/run_eval.py --model-config <name>`
# reads one entry by its `name`. Everything here is configuration, not code: hardware,
# precision, quantization, thinking switches and provider limits live here so that a run's
# manifest can copy the entry verbatim (checklist C1/C4).
#
# Reading the flags:
#   hf_id_status: known      the checkpoint existed under this id when the plan was written
#                            (still request gated access and re-check before the run)
#   hf_id_status: uncertain  the plan names a family or version that could not be resolved
#                            from the build machine (huggingface.co unreachable). Every such
#                            entry carries "[UNCERTAIN: verify]" in `verify`. Keep the plan's
#                            names; fix the id, never the name, when the panel is frozen.
#
# The 21-model PANEL = every entry whose group is one of the seven panel groups below.
# Entries in the groups `bf16_reference` and `reasoning_substudy` are serving variants of
# panel models (same weights, different precision or thinking switch) used by the bf16-drift
# check and the reasoning-cost curve; they exist so that the eval CLI needs no override flag.
#
# Hardware/dtype rules (enforced by tests/test_cloud.py):
#   * a T4 (compute capability 7.5) has no bfloat16 units and vLLM refuses bf16 on it; T4
#     entries are float16, float32, or quantized;
#   * Gemma 3 is NEVER float16 (activations overflow: transformers PR #36832); it runs in
#     float32 on T4s or bfloat16 on the TPU; the rule is keyed on the hf_id (google/gemma-3-*)
#     as well as on the family label, and every such entry carries `never_float16: true`;
#   * TPU entries are bfloat16 with tensor_parallel_size 8 (one v5e-8 = 8 chips of 16 GB);
#     the Modal L4 (`l4`) is the bf16 fallback for a reference run vLLM-TPU cannot serve;
#   * API entries have no dtype;
#   * every self-hosted entry carries `revision` (DESIGN_DECISIONS 7.1: the runner refuses to
#     start unless it is a full commit hash, a Kaggle Models slug + version or a GGUF SHA-256);
#     it is null until the panel is frozen and MUST be filled before a paper run. The eval
#     harness does not check it yet (open item for noilai/eval).
# Engine defaults follow DESIGN_DECISIONS 7.3 (vLLM 0.30.0 on Kaggle 2xT4): max_model_len 1024,
# gpu_memory_utilization 0.85, TRITON_ATTN, zero multimodal limits, prefix caching, 64 seqs.

version: 1
date: 2026-09-30
plan: docs/PLAN_2026-09-30.md

defaults:
  max_model_len: 1024          # DESIGN_DECISIONS 7.3: ~500 prompt tokens (3 demonstrations) + <= 64 output tokens under NFC; [UNCERTAIN: verify] that the NFD prompts (~1.6x the tokens on Gemma 3) stay under 1024 - 64, else raise per entry and record it
  max_new_tokens: 64
  temperature: 0.0             # greedy decoding everywhere (plan 2.5)
  seed: 20261004
  gpu_memory_utilization: 0.85 # DESIGN_DECISIONS 7.3 (the plan said <= 0.9); CUDA graphs on unless a model forces eager
  enforce_eager: false         # flip per model on a graph-capture failure and record it in the manifest
  trust_remote_code: false
  answer_regex: "Đáp án:"      # the answer line the extractor looks for (plan 2.5)
  revision: null               # every self-hosted entry overrides this with a full commit hash before a paper run (DD 7.1)
  # Extra vLLM engine arguments of DESIGN_DECISIONS 7.3, passed through `engine_kwargs`
  # (noilai.eval.backends.VLLMBackend forwards them to LLM(...)). Written for the CUDA build;
  # TPU entries override the block (TRITON_ATTN is a GPU backend). [UNCERTAIN: verify] every
  # flag name against the pinned vLLM 0.30.0, and that limit_mm_per_prompt with a modality the
  # model lacks is accepted (drop the key for text-only models if it is refused).
  engine_kwargs:
    attention_backend: TRITON_ATTN
    limit_mm_per_prompt: {image: 0, audio: 0}
    enable_prefix_caching: true
    max_num_seqs: 64

hardware:
  t4:
    description: "one Tesla T4, 16 GB, compute capability 7.5 (Kaggle or free Colab)"
    allowed_dtypes: [float16, float32]
    allows_quantization: true
    tensor_parallel_size: 1
    source: https://docs.vllm.ai/en/latest/getting_started/installation/gpu.html
  2xt4:
    description: "Kaggle 2 x Tesla T4 (2 x 16 GB), tensor parallel 2"
    allowed_dtypes: [float16, float32]
    allows_quantization: true
    tensor_parallel_size: 2
    source: https://github.com/kaggle-vllm/kaggle-vllm
  tpu:
    description: "Kaggle TPU v5e-8 (8 chips x 16 GB = 128 GB HBM) through vLLM-TPU; 9-hour sessions, ~20 h/week"
    allowed_dtypes: [bfloat16]
    allows_quantization: false
    tensor_parallel_size: 8        # kaggle-tpu-lab's recipe: one process over the 8 chips; 27B bf16 (~54 GB) cannot load on one 16 GB chip
    source: https://github.com/ARahim3/kaggle-tpu-lab
  l4:
    description: "Modal L4 (24 GB, compute capability 8.9, bf16-capable): overflow for a bf16 reference run that vLLM-TPU cannot serve (plan 3: 'bf16 reruns if the TPU route fails'); card on file"
    allowed_dtypes: [bfloat16, float16, float32]
    allows_quantization: true
    tensor_parallel_size: 1
    fallback_only: true
    source: https://modal.com/pricing
  api:
    description: "hosted inference; generation only, no log-probabilities"
    allowed_dtypes: [null]
    allows_quantization: false
    tensor_parallel_size: 0
  p100:
    description: "Kaggle P100: below vLLM's compute-capability floor (7.5); transformers or llama.cpp only"
    allowed_dtypes: [float16, float32]
    allows_quantization: true
    tensor_parallel_size: 1
    fallback_only: true
    source: https://docs.vllm.ai/en/latest/getting_started/installation/gpu.html

groups:
  interpretability_ladder:
    why: "Gemma Scope 2 covers every layer of every Gemma 3 size; E4 probes the 1B and 4B"
    panel: true
  general_multilingual:
    why: "scaling within two Apache-2.0 families (Qwen3.5, Gemma 4)"
    panel: true
  sea_specialised:
    why: "Southeast Asian continued training; SEA-LION E2B vs Gemma 4 E2B isolates SEA training if the tokenizer was kept"
    panel: true
  vietnamese_specialised:
    why: "Vietnamese-first tokenizers (PhoGPT's 20,480-token vocabulary; Vistral's extended vocabulary)"
    panel: true
  legacy_baseline:
    why: "Vietnamese not officially supported"
    panel: true
  large_open_reference:
    why: "largest open models that fit free hardware (TPU v5e-8)"
    panel: true
  api:
    why: "strong hosted reference, generation only; sees the 1,500-item core only"
    panel: true
  bf16_reference:
    why: "about 200 items per T4 model re-run in bf16 (plan 2.5) to measure precision drift"
    panel: false
  reasoning_substudy:
    why: "500-item run with thinking ON: accuracy against reasoning tokens (plan 2.5)"
    panel: false

providers:
  gemini:
    backend: gemini
    sdk: google-genai
    api_key_env: GEMINI_API_KEY
    base_url: null
    free_tier:
      covers: "Flash and Flash-Lite models only"
      requests_per_day: null     # shown only inside AI Studio; the third-party figure of 1,500 RPD is unverified [UNCERTAIN: verify]; the api_runs notebook's GEMINI_RPD_OVERRIDE sets the ledger cap in memory
      requests_per_minute: null  # [UNCERTAIN: verify] read in AI Studio at run time and record in the manifest (the entries carry a conservative client-side pace)
      tokens_per_day: null
      scope: per_project         # Gemini quotas are per Google Cloud project [UNCERTAIN: verify]
      source: https://ai.google.dev/gemini-api/docs/rate-limits
      pricing_source: https://ai.google.dev/gemini-api/docs/pricing
    terms:
      trains_on_inputs: true      # unpaid tier: prompts and responses improve Google's products; human reviewers may read them
      minimum_age: 18
      source: https://ai.google.dev/gemini-api/terms
    data_policy: "core set only; never the sealed split; never annotator personal data"
  groq:
    backend: openai_compat
    sdk: openai
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    free_tier:
      requests_per_day: 1000
      tokens_per_day: 200000     # the binding cap: at ~500 tokens a call it is reached after ~400 calls, long before 1,000 requests
      requests_per_minute: 30    # DESIGN_DECISIONS 7.2 (30 RPM); the backend paces itself from the entry's requests_per_minute [UNCERTAIN: verify] against the console on the run date
      tokens_per_minute: 8000    # DESIGN_DECISIONS 7.2 [UNCERTAIN: verify]
      # Scope of the daily caps. The plan (section 3) and console.groq.com list the limits PER MODEL;
      # DESIGN_DECISIONS 7.2 writes "per org". Both are recorded here: `scope: per_model` means the
      # ledger caps each model separately, `scope: per_org` pools every model of the provider into
      # one daily budget. [UNCERTAIN: verify] in the Groq console before 9 Nov 2026 and flip if needed.
      scope: per_model
      scope_alternatives: [per_model, per_org]
      source: https://console.groq.com/docs/rate-limits
      note: "at ~500 tokens per request the 1,500-item core alone takes about four days per model; the plan starts both Groq models on 9 Nov 2026"
      catalogue_risk: "Groq retired Llama from its free plan on 16 Aug 2026 (https://klymentiev.com/blog/groq-pricing); pin model ids and dates, save raw outputs immediately"
    data_policy: "core set only; never the sealed split"
  openrouter:                    # optional fifth API model, $10 once for 1,000 requests/day
    backend: openai_compat
    sdk: openai
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    free_tier:
      requests_per_day: 50       # 1,000 after a one-time $10 purchase
      source: https://openrouter.ai/docs/api-reference/limits
    terms:
      trains_on_inputs: "provider-dependent; filtered by an account setting"
      source: https://openrouter.ai/docs/features/privacy-and-logging
    data_policy: "core set only; not in the 21-model panel"

