# configs/compute_chunks.yaml -- GENERATED by scripts/plan_chunks.py from configs/run_plan.yaml and
# configs/models.yaml; do not edit (change the rules in the script, then --write). docs/COMPUTE_PLAN.md
# explains the order (reverse of the pre-registered cut order) and the estimates (plan estimates, equal split
# per model, re-priced after the smoke week; none is a measurement).
version: 1
generated_by: scripts/plan_chunks.py
run_plan: configs/run_plan.yaml
rules:
  order: reverse of the pre-registered cut order (DD 7.1, DD 8.5); tiers in TIER_LABEL
  estimate: line estimate split equally over the line's models; plan estimate, not a measurement
  session_cap_hours:
    gpu: 8.0
    tpu: 7.0
    cpu: 10.0
  session_overhead_hours_assumed: 0.5
  first_of_family:
    gemma3: gemma-3-1b-it
    qwen3.5: qwen3.5-2b
    gemma4: gemma-4-e2b
    sea-lion-v4.5: gemma-sea-lion-v4.5-e2b-it
    sailor2: sailor2-8b-chat
    phogpt: phogpt-4b-chat
    vistral: vistral-7b-chat
    llama3.1: llama-3.1-8b-instruct
    qwen3.8: qwen3.8-27b
  redundant:
  - gemma-3-12b-it
  - qwen3.5-0.8b
  - gemma-4-12b
  quota_readings:
    x1: a 2xT4 session hour costs one quota hour
    x2: 'a 2xT4 session hour costs two [UNCERTAIN: verify]'
tiers:
  0: pre-stage-2, dev split only (smoke, pilot)
  1: first model of each family, main lines (never cut)
  2: lines outside the cut order on tier-1 models (ablations, reasoning, bf16 drift)
  3: second model of a family (DD 7.1 cut stage 2)
  4: tokenizer-redundant models (DD 7.1 cut stage 1)
  5: 'p2 of TPU/2xT4 models; E3 of normalizing families (DD 8.5: cut first)'
not_chunked:
  api: 'API lines are bounded by the providers'' daily caps, not by sessions: notebooks/api_runs.ipynb, re-run daily (the
    ledger parks a model at its cap)'
  E4_probe: not a run_eval line; notebooks/colab_probe_gemma3.ipynb is a skeleton without resume (the E4 protocol is a stage-2
    item); window 23 Nov-6 Dec, after the results freeze
unscheduled:
- run: bf16_drift_200
  model: phogpt-4b-chat--bf16
  hours:
  - 0.21
  - 0.5
  reason: 'configured for ''l4'': no zero-cost route in the plan (Modal L4 needs a card on file, which this project does not
    use); question to the author'
